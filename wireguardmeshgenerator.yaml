    lan:
      domain: lan.buetow.org
      ip: 10.20.0.121
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.121
      ipv6: fd42:beef:cafe:2::121
    exclude_peers:
    - earth
