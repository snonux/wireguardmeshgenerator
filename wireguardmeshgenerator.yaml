hosts:
  f0:
    os: FreeBSD
    ssh:
      user: paul
      conf_dir: /usr/local/etc/wireguard
      sudo_cmd: doas
      reload_cmd: service wireguard reload
    lan:
      domain: lan.buetow.org
      ip: 192.168.1.130
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.130
      ipv6: fd42:beef:cafe:2::130
    exclude_peers:
    - earth
    - pixel7pro
    - freebsd
    - uranus
