    - freebsd
    - uranus
  r2:
    os: Linux
    ssh:
      user: root
      conf_dir: /etc/wireguard
      sudo_cmd: null
      reload_cmd: systemctl reload wg-quick@wg0.service
    lan:
      domain: lan.buetow.org
      ip: 10.20.0.122
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.122
      ipv6: fd42:beef:cafe:2::122
    exclude_peers:
    - earth
    - pixel7pro
    - freebsd
    - uranus
  blowfish:
    os: OpenBSD
    ssh:
      user: rex
      port: 2
      conf_dir: /etc/wireguard
      sudo_cmd: doas
      reload_cmd: sh /etc/netstart wg0
    internet:
      domain: buetow.org
      ip: 23.88.35.144
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.110
      ipv6: fd42:beef:cafe:2::110
  fishfinger:
    os: OpenBSD
    # primary_gateway: true marks fishfinger as the single gateway peer that receives
    # AllowedIPs = 0.0.0.0/0, ::/0 on roaming clients (earth, pixel7pro, uranus).
    # wg-quick can only install one default route, so only the primary gateway gets
    # the catch-all; secondary gateways (blowfish) get their specific /32+/128 only.
    primary_gateway: true
    ssh:
      user: rex
      port: 2
      conf_dir: /etc/wireguard
      sudo_cmd: doas
      reload_cmd: sh /etc/netstart wg0
    internet:
      domain: buetow.org
      ip: 46.23.94.99
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.111
      ipv6: fd42:beef:cafe:2::111
  earth:
    os: Linux
    # reachable_via declares that earth's wg0 IPs should be appended to the named
    # gateway peer's AllowedIPs on infra hosts that peer with that gateway.
    # Earth is behind NAT and cannot be a direct peer on infra hosts; instead,
    # traffic routes via fishfinger -> earth.
    # WireGuard requires each AllowedIPs prefix to belong to exactly one peer, so
    # only one gateway can hold earth's IPs; fishfinger is the primary gateway.
    reachable_via: fishfinger
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.200
      ipv6: fd42:beef:cafe:2::200
    exclude_peers:
    - f0
    - f1
    - f2
    - r0
    - r1
    - r2
    - pixel7pro
    - freebsd
    - uranus
  uranus:
    os: Linux
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.205
      ipv6: fd42:beef:cafe:2::205
    exclude_peers:
    - f0
    - f1
    - f2
    - r0
    - r1
    - r2
    - earth
    - pixel7pro
    - freebsd
  pixel7pro:
    os: Android
    # Private mesh services require p7p-fishfinger for the symmetric return path.
    reachable_via: fishfinger
    # Generate one independently selectable full-tunnel config per gateway.
    android_gateways:
      blowfish: p7p-blowfish
      fishfinger: p7p-fishfinger
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.201
      ipv6: fd42:beef:cafe:2::201
    exclude_peers:
    - f0
    - f1
    - f2
    - r0
    - r1
    - r2
    - earth
    - freebsd
    - uranus
  freebsd:
    os: FreeBSD
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.202
      ipv6: fd42:beef:cafe:2::202
    exclude_peers:
    - f0
    - f1
    - f2
    - r0
    - r1
    - r2
    - earth
    - pixel7pro
    - uranus
    gateway: false
  pi0:
    os: NetBSD
    ssh:
      user: paul
      conf_dir: /usr/pkg/etc/wireguard
      sudo_cmd: doas
      reload_cmd: /etc/rc.d/wireguard restart
      wg_bin: /usr/pkg/bin/wg
    lan:
      domain: lan.buetow.org
      ip: 10.20.0.125
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.203
      ipv6: fd42:beef:cafe:2::203
    exclude_peers:
    - f0
    - f1
    - f2
    - f3
    - r0
    - r1
    - r2
    - earth
    - pixel7pro
    - freebsd
    - pi1
    - uranus
    # rocky is gateway-only (it excludes pi0/pi1); keep this symmetric or
    # pi0 carries a peer that can never complete a handshake.
    - rocky
  pi1:
    os: NetBSD
    ssh:
      user: paul
      conf_dir: /usr/pkg/etc/wireguard
      sudo_cmd: doas
      reload_cmd: /etc/rc.d/wireguard restart
      wg_bin: /usr/pkg/bin/wg
    lan:
      domain: lan.buetow.org
      ip: 10.20.0.126
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.204
      ipv6: fd42:beef:cafe:2::204
    exclude_peers:
    - f0
    - f1
    - f2
    - f3
    - r0
    - r1
    - r2
    - earth
    - pixel7pro
    - freebsd
    - pi0
    - uranus
    # rocky is gateway-only (it excludes pi0/pi1); keep this symmetric or
    # pi1 carries a peer that can never complete a handshake.
    - rocky
  rocky:
    os: Linux
    ssh:
      user: root
      conf_dir: /etc/wireguard
      sudo_cmd: null
      reload_cmd: systemctl reload wg-quick@wg0.service
    lan:
      domain: lan.buetow.org
      ip: 10.20.0.123
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.123
      ipv6: fd42:beef:cafe:2::123
    exclude_peers:
    - f0
    - f1
    - f2
    - f3
    - r0
    - r1
    - r2
    - earth
    - pixel7pro
    - freebsd
    - pi0
    - pi1
    - uranus
# Hub-and-spoke access VPNs. They are separate from the wg0 mesh above: own
# keys under keys/<network>/<host>/, own subnet and port, no PSKs, and
# --install never touches them (see README.md).
access_networks:
  wg2:
    # triggerfish (OpenBSD home-lab router) terminates the admin VPN and
    # renders /etc/hostname.wg2. Router changes go through conf's guarded
    # router-rollback path, never through this generator's --install.
    hub:
      host: triggerfish
      os: OpenBSD
      ip: 10.99.0.1
      netmask: 255.255.255.0
      port: 51822
      # Router igc0 address, reachable from the home Wi-Fi/ISP LAN.
      endpoint: 192.168.1.2
    clients:
      earth:
        os: Linux
        ip: 10.99.0.2
        keepalive: 25
        # Prefixes earth routes into wg2 (lab, Shelly plugs, the hub itself).
        # 192.168.11.140-143 are stale (no router PF rule matches them any
        # more) and kept only until someone decides to drop them.
        routes:
        - 10.20.0.0/24
        - 10.30.0.28/32
        - 10.30.0.29/32
        - 10.99.0.1/32
        - 192.168.11.140/32
        - 192.168.11.141/32
        - 192.168.11.142/32
        - 192.168.11.143/32
      pixel7pro:
        # Public-only peer: its private key exists only on the phone (it is
        # not the wg0 pixel7pro key), so no client config is generated.
        ip: 10.99.0.3
        public_key: AgyVbKmGEi0f5W9HyKnKKtAR0X338rB7SBO+SF6IhgA=
