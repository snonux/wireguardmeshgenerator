    exclude_peers:
    - earth
    - pixel7pro
    - freebsd
    - uranus
  blowfish:
    os: OpenBSD
    ssh:
      user: rex
      port: 2
      conf_dir: /etc/wireguard
      sudo_cmd: doas
      reload_cmd: sh /etc/netstart wg0
    internet:
      domain: buetow.org
      ip: 23.88.35.144
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.110
      ipv6: fd42:beef:cafe:2::110
  fishfinger:
    os: OpenBSD
    # primary_gateway: true marks fishfinger as the single gateway peer that receives
    # AllowedIPs = 0.0.0.0/0, ::/0 on roaming clients (earth, pixel7pro, uranus).
    # wg-quick can only install one default route, so only the primary gateway gets
    # the catch-all; secondary gateways (blowfish) get their specific /32+/128 only.
    primary_gateway: true
    ssh:
      user: rex
      port: 2
      conf_dir: /etc/wireguard
      sudo_cmd: doas
      reload_cmd: sh /etc/netstart wg0
    internet:
      domain: buetow.org
      ip: 46.23.94.99
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.111
      ipv6: fd42:beef:cafe:2::111
  earth:
    os: Linux
    # reachable_via declares that earth's wg0 IPs should be appended to the named
    # gateway peer's AllowedIPs on infra hosts that peer with that gateway.
    # Earth is behind NAT and cannot be a direct peer on infra hosts; instead,
    # traffic routes via fishfinger -> earth.
    # WireGuard requires each AllowedIPs prefix to belong to exactly one peer, so
    # only one gateway can hold earth's IPs; fishfinger is the primary gateway.
    reachable_via: fishfinger
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.200
      ipv6: fd42:beef:cafe:2::200
    exclude_peers:
    - f0
    - f1
    - f2
    - r0
    - r1
    - r2
    - pixel7pro
    - freebsd
    - uranus
  uranus:
    os: Linux
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.205
      ipv6: fd42:beef:cafe:2::205
    exclude_peers:
    - f0
    - f1
    - f2
    - r0
    - r1
    - r2
    - earth
    - pixel7pro
    - freebsd
  pixel7pro:
    os: Android
    wg0:
      domain: wg0.wan.buetow.org
      ip: 192.168.2.201
      ipv6: fd42:beef:cafe:2::201
